<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://aframe.io"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>

    <title>Spider</title>

    <script>
        AFRAME.registerComponent('fix-camera', {
            init: function () {
                this.el.addEventListener('renderstart', () => {
                    const camera = this.el.camera;
                    if (camera) {
                        camera.near = 0.001;
                        camera.far = 10000;
                        camera.updateProjectionMatrix();
                    }
                });
            }
        });
    </script>
</head>

<body>


    <a-scene
        fix-camera
        mindar-image="imageTargetSrc: assets/targets.mind; filterMinCF: 0.0001; filterBeta: 0.001;"
        color-space="sRGB"
        renderer="colorManagement: true;"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-assets>
            <a-asset-item
                id="spider"
                src="assets/spider.glb">
            </a-asset-item>
        </a-assets>

        <a-light type="ambient" intensity="1"></a-light>

        <a-light
            type="directional"
            position="1 2 1"
            intensity="1">
        </a-light>

        <a-camera
            position="0 0 0"
            look-controls="enabled: false">
        </a-camera>

        

             <a-gltf-model
                src="#spider"
                position="0 0 0"
                rotation="0 0 0"
                scale="1 1 1"
                animation-mixer="clip: *; loop: repeat; autoplay: true">
            </a-gltf-model>

        

    </a-scene>

</body>

</html>
