<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.4.0/dist/aframe-extras.min.js"></script>

    <title>Spider</title>
</head>

<body>

    <!-- МИ ДОДАЛИ НАЛАШТУВАННЯ КАМЕРИ ПРЯМО СЮДИ (через renderer та окремі змінні MindAR) -->
    <a-scene
        mindar-image="imageTargetSrc: assets/targets.mind; filterMinCF: 0.01; filterBeta: 100; missTolerance: 5;"
        color-space="sRGB"
        renderer="colorManagement: true; sortObjects: true;"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-assets>
            <a-asset-item
                id="spider"
                src="assets/spider.glb">
            </a-asset-item>
        </a-assets>

        <a-light type="ambient" intensity="1"></a-light>

        <a-light
            type="directional"
            position="1 2 1"
            intensity="1">
        </a-light>

        <!-- Тег камери залишаємо чистим, MindAR сам ним керує -->
        <a-camera
            position="0 0 0"
            look-controls="enabled: false">
        </a-camera>

        

             <a-gltf-model
                src="#spider"
                position="0 0 0"
                rotation="0 0 0"
                scale="1 1 1"
                animation-mixer="clip: *; loop: repeat; autoplay: true">
            </a-gltf-model>

        

    </a-scene>

</body>

</html>
